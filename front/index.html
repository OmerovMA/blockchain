<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BBHS Магазин</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Ваш кошелёк: <span id="wallet">—</span></h1>
  <h2>Баланс: <span id="balance">?</span> BBHS</h2>

  <input type="number" id="amount" placeholder="Сколько получить от разработчика" />
  <button onclick="getGift()">Получить токены от разработчика</button>

  <script>
    const contractAddress = "0x..."; // Адрес токена BBHS
    const contractABI = [
      "function balanceOf(address) view returns (uint)",
    ];

    let userAddress;

    async function connectWallet() {
      if (window.ethereum) {
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById('wallet').textContent = userAddress;
        await updateBalance();
      } else {
        alert("Установите MetaMask!");
      }
    }

    async function updateBalance() {
      const provider = new ethers.BrowserProvider(window.ethereum);
      const contract = new ethers.Contract(contractAddress, contractABI, provider);
      const balance = await contract.balanceOf(userAddress);
      document.getElementById('balance').textContent = balance.toString();
    }

    async function getGift() {
      const amount = parseInt(document.getElementById('amount').value);
      if (!userAddress || isNaN(amount) || amount <= 0) return alert("Ошибка ввода");

      const res = await fetch("http://localhost:3000/transfer", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: userAddress, amount })
      });

      const data = await res.json();
      if (data.success) {
        alert("Успешно отправлено: " + data.txHash);
        await updateBalance();
      } else {
        alert("Ошибка: " + data.error);
      }
    }

    connectWallet();
  </script>
</body>
</html>
