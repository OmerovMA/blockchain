<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Магазин</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .wallet {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .container {
      max-width: 960px;
      margin: 100px auto 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 0 10px;
    }
    .item {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
      width: 30%;
    }
    .item img {
      width: 100%;
      border-radius: 8px;
    }
    .controls {
      margin-top: 10px;
    }
    .controls button {
      margin: 5px;
      padding: 5px 10px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .controls button:hover {
      background: #0056b3;
    }
    .bottom-panel {
      text-align: center;
      margin-top: 30px;
    }
    .bottom-panel input {
      padding: 5px;
      width: 100px;
      margin-right: 5px;
    }
    .bottom-panel button {
      margin: 5px;
      padding: 5px 10px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .bottom-panel button:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>
  <div class="wallet">Баланс: <span id="balance">100</span> BBHS</div>

  <div class="container">
    <div class="item" data-id="0" data-price="30">
      <img src="https://via.placeholder.com/200x150?text=Объект+1" alt="Объект 1" />
      <div>Цена: 30 BBHS</div>
      <div>Куплено: <span class="count">0</span></div>
      <div class="controls">
        <button class="buy">Купить</button>
        <button class="sell">Продать</button>
      </div>
    </div>
    <div class="item" data-id="1" data-price="50">
      <img src="https://via.placeholder.com/200x150?text=Объект+2" alt="Объект 2" />
      <div>Цена: 50 BBHS</div>
      <div>Куплено: <span class="count">0</span></div>
      <div class="controls">
        <button class="buy">Купить</button>
        <button class="sell">Продать</button>
      </div>
    </div>
    <div class="item" data-id="2" data-price="80">
      <img src="https://via.placeholder.com/200x150?text=Объект+3" alt="Объект 3" />
      <div>Цена: 80 BBHS</div>
      <div>Куплено: <span class="count">0</span></div>
      <div class="controls">
        <button class="buy">Купить</button>
        <button class="sell">Продать</button>
      </div>
    </div>
  </div>

  <div class="bottom-panel">
    <input type="number" id="amount" placeholder="Сумма" />
    <button onclick="topUp()">Пополнить</button>
    <button onclick="transfer()">Перевести</button>
    <button onclick="receive()">Получить входящие</button>
  </div>

  <script>

  const contractABI = [

    {

            },
            {

                "type": "address"
            },
            {
                "internalType": "uint256",
                "name": "amount",
                "type": "uint256"
            }
        ],
        "name": "transferFrom",
        "outputs": [
            {
                "internalType": "bool",
                "name": "",
                "type": "bool"
            }
        ],
        "stateMutability": "nonpayable",
        "type": "function"
    }
];

  let provider, signer, contract, userAddress;
  const devAddress = "0x894205249444FA84044206DadA62e41DF37cf320";

  async function setupContract() {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    contract = new ethers.Contract(contractAddress, contractABI, signer);
    await updateBalanceFromChain();
  }

  async function updateBalanceFromChain() {
    const bal = await contract.checkBalance();
    document.getElementById('balance').textContent = bal;
  }

  async function buy(itemEl) {
    const price = parseInt(itemEl.dataset.price);
    const tx = await contract.transfer(devAddress, price);
    await tx.wait();

    const countEl = itemEl.querySelector('.count');
    let count = parseInt(countEl.textContent);
    count++;
    countEl.textContent = count;

    await updateBalanceFromChain();
  }

  async function sell(itemEl) {
    const price = parseInt(itemEl.dataset.price);
    const tx = await contract.transferFrom(devAddress, userAddress, price);
    await tx.wait();

    const countEl = itemEl.querySelector('.count');
    let count = parseInt(countEl.textContent);
    if (count > 0) {
      count--;
      countEl.textContent = count;
      await updateBalanceFromChain();
    }
  }

  async function topUp() {
    const amount = parseInt(document.getElementById('amount').value);
    if (!isNaN(amount) && amount > 0) {
      const tx = await contract.transferFrom(devAddress, userAddress, amount);
      await tx.wait();
      await updateBalanceFromChain();
    }
  }

  async function receive() {
    const tx = await contract.giveRandomGift(devAddress, userAddress);
    await tx.wait();
    await updateBalanceFromChain();
  }

  // Привязка кнопок
  document.querySelectorAll('.buy').forEach(btn => {
    btn.addEventListener('click', async e => {
      const item = e.target.closest('.item');
      await buy(item);
    });
  });

  document.querySelectorAll('.sell').forEach(btn => {
    btn.addEventListener('click', async e => {
      const item = e.target.closest('.item');
      await sell(item);
    });
  });

  setupContract();
  </script>
</body>
</html>
